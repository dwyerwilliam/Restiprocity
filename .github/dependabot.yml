# Dependabot opens pull requests for updates. Each one runs the Build & Release workflow's build and tests
# (its `pull_request` trigger); nothing is published from a pull request.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # One pull request for the compatible updates; a major version arrives on its own.
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # A new Electron major changes Chromium and Node together and is upgraded by hand (see AGENTS.md).
      - dependency-name: "electron"
        update-types: ["version-update:semver-major"]

  # Actions are pinned to commits in the workflows; this keeps the pins and their version comments current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
