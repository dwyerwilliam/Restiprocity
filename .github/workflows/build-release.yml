name: Build & Release

on:
  push:
    tags:
      - 'v*'
  # Manual run on a branch builds and tests everything. `release` is skipped there: it runs only for a tag.
  workflow_dispatch:
  # Pull requests (Dependabot's included) get the same build and tests, so an update is never merged unchecked.
  pull_request:

# Actions are pinned to commits; Dependabot (.github/dependabot.yml) proposes updates with the version in the comment.
# Jobs get a read-only token. `release` alone asks for more.
permissions:
  contents: read

jobs:
  build:
    strategy:
      # Let every system finish so one run reports all three; `release` still needs every build to pass.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        include:
          - os: macos-latest
            platform: mac
            arch: x64
            targets: 'dmg'
          - os: windows-latest
            platform: win
            arch: x64
            targets: 'nsis'
          - os: ubuntu-latest
            platform: linux
            arch: x64
            targets: 'AppImage'
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: 'npm'

      - run: npm ci

      - name: Build renderer
        run: npm run build:renderer

      - name: Build main/preload
        run: npx vite build --config vite.config.ts

      - name: Electron smoke (Windows)
        if: matrix.platform == 'win'
        run: npm run test:electron

      - name: Electron smoke (macOS)
        if: matrix.platform == 'mac'
        run: npm run test:electron

      - name: Install xvfb for Electron smoke (Linux)
        if: matrix.platform == 'linux'
        run: sudo apt-get update -y && sudo apt-get install -y xvfb

      - name: Electron smoke (Linux)
        if: matrix.platform == 'linux'
        run: xvfb-run -a npm run test:electron

      - name: Package Windows
        if: matrix.platform == 'win'
        shell: bash
        run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Package macOS
        if: matrix.platform == 'mac'
        run: npx electron-builder --mac --publish never
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Package Linux
        if: matrix.platform == 'linux'
        run: npx electron-builder --linux --publish never
        env:
          GH_TOKEN: ${{ github.token }}

      # The packaged build has its fuses flipped and its archive checked at start, so prove that it still runs.
      - name: Packaged app starts (Windows, macOS)
        if: matrix.platform != 'linux'
        run: npm run test:packaged

      - name: Packaged app starts (Linux)
        if: matrix.platform == 'linux'
        run: xvfb-run -a npm run test:packaged

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.platform }}
          path: releases/artifacts/**/*
          retention-days: 1

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: 'npm'

      - run: npm ci

      - name: Stop background apt services
        run: |
          sudo systemctl stop apt-daily.service apt-daily-upgrade.service unattended-upgrades.service || true
          sudo systemctl stop apt-daily.timer apt-daily-upgrade.timer || true
          sudo systemctl disable apt-daily.service apt-daily-upgrade.service unattended-upgrades.service || true
          sudo flock --wait 30 /var/lib/dpkg/lock-frontend true || true
          # playwright's --with-deps runs apt-get via sudo, which strips step-level env vars,
          # so NEEDRESTART_MODE=a alone won't reach it; drop a config override instead so
          # needrestart never blocks on an interactive restart-services prompt.
          echo '$nrconf{restart} = '"'"'a'"'"';' | sudo tee /etc/needrestart/conf.d/99-noninteractive.conf

      - name: Install Playwright browsers
        env:
          NEEDRESTART_MODE: a
          NEEDRESTART_SUSPEND: 1
        run: npx playwright install chromium --with-deps

      - name: Build renderer
        run: npm run build:renderer

      - name: Run E2E tests
        run: npm test

  updater-unit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: 'npm'

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run updater service tests
        run: npm run test:update

  engine-node-abi:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: 'npm'

      - run: npm ci

      - name: Node-ABI engine suite (strict)
        run: npm run test:engine:node-abi

      - name: Restore Electron ABI (always)
        if: always()
        run: npm run rebuild:electron

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # What ships to users: a known high or critical advisory in a runtime dependency stops the release.
      - name: Audit shipped dependencies
        run: npm audit --omit=dev --audit-level=high

      # Build and test tooling never reaches users, so it is listed and does not fail the job.
      - name: Audit development dependencies (report only)
        if: always()
        continue-on-error: true
        run: npm audit --audit-level=high

  release:
    needs: [build, test, updater-unit, engine-node-abi, audit]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      # For the build attestation: a signing identity for this run, and permission to store the result.
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: 'npm'

      - run: npm ci

      - name: Download all artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: releases/artifacts

      - name: Prepare release assets
        run: |
          set -euo pipefail

          echo "=== Win artifacts ==="
          ls -la releases/artifacts/release-win/ 2>/dev/null || echo "No win artifacts"
          echo "=== Mac artifacts ==="
          ls -la releases/artifacts/release-mac/ 2>/dev/null || echo "No mac artifacts"
          echo "=== Linux artifacts ==="
          ls -la releases/artifacts/release-linux/ 2>/dev/null || echo "No linux artifacts"

          # Remove unpacked directories and .app bundles
          find releases/artifacts/ -type d -name "*-unpacked" -exec rm -rf {} + 2>/dev/null || true
          find releases/artifacts/ -type d -name "*.app" -exec rm -rf {} + 2>/dev/null || true

          echo "=== After cleanup ==="
          find releases/artifacts/ -type f

      - name: Validate release contract
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF#refs/tags/}"
          RELEASE_NOTES_FILE="releases/${TAG}.md"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_VERSION="${TAG#v}"
          WIN_DIR="releases/artifacts/release-win"
          INSTALLER="${WIN_DIR}/Restiprocity-Setup-${PACKAGE_VERSION}.exe"
          BLOCKMAP="${INSTALLER}.blockmap"
          LATEST_YML="${WIN_DIR}/latest.yml"

          if [ "$PACKAGE_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "ERROR: Tag ${TAG} does not match package.json version ${PACKAGE_VERSION}"
            exit 1
          fi

          if [ ! -f "$RELEASE_NOTES_FILE" ]; then
            echo "ERROR: Missing release notes file: $RELEASE_NOTES_FILE"
            exit 1
          fi

          for asset in "$INSTALLER" "$BLOCKMAP" "$LATEST_YML"; do
            if [ ! -f "$asset" ]; then
              echo "ERROR: Missing required Windows updater asset: $asset"
              exit 1
            fi
          done

          mapfile -t WINDOWS_ASSETS < <(find "$WIN_DIR" -maxdepth 1 -type f \( -name 'Restiprocity-Setup-*.exe' -o -name 'Restiprocity-Setup-*.exe.blockmap' -o -name 'latest.yml' \) | sort)

          if [ "${#WINDOWS_ASSETS[@]}" -ne 3 ]; then
            echo "ERROR: Windows updater asset set must contain exactly one installer, one blockmap, and one latest.yml"
            printf '  - %s\n' "${WINDOWS_ASSETS[@]}"
            exit 1
          fi

          node -e 'const fs=require("fs"); const crypto=require("crypto"); const yaml=require("js-yaml"); const metadata=yaml.load(fs.readFileSync(process.argv[1], "utf8")); if(!metadata||metadata.version!==process.argv[3]){console.error("ERROR: latest.yml version does not match package.json"); process.exit(1);} if(!Array.isArray(metadata.files)||metadata.files.length!==1){console.error("ERROR: latest.yml must contain exactly one installer entry"); process.exit(1);} const entry=metadata.files[0]; const installerName=entry.url; const expectedName="Restiprocity-Setup-"+process.argv[3]+".exe"; if(installerName!==expectedName){console.error("ERROR: latest.yml references unexpected installer name: "+installerName); process.exit(1);} if(entry.isAdminRightsRequired!==true){console.error("ERROR: latest.yml must require administrator rights for the per-machine installer"); process.exit(1);} if(typeof entry.sha512!=="string"||entry.sha512.length===0){console.error("ERROR: latest.yml installer entry is missing sha512"); process.exit(1);} if(metadata.path!==installerName||metadata.sha512!==entry.sha512){console.error("ERROR: latest.yml top-level path/sha512 must match files[0]"); process.exit(1);} const installerPath=process.argv[2]+"/"+installerName; if(!fs.existsSync(installerPath)){console.error("ERROR: latest.yml references missing installer: "+installerName); process.exit(1);} const actualSha=crypto.createHash("sha512").update(fs.readFileSync(installerPath)).digest("base64"); if(actualSha!==entry.sha512){console.error("ERROR: latest.yml sha512 does not match the installer"); process.exit(1);} console.log("Validated "+installerName+" against latest.yml with administrator rights required");' "$LATEST_YML" "$WIN_DIR" "$PACKAGE_VERSION"

          echo "Windows updater contract validated for ${PACKAGE_VERSION}"

      # One line per published file, named as it is on the release page: `sha256sum -c --ignore-missing SHA256SUMS.txt`.
      - name: Write checksums
        run: |
          set -euo pipefail

          cd releases/artifacts
          : > SHA256SUMS.txt
          while IFS= read -r -d '' file; do
            (cd "$(dirname "$file")" && sha256sum "$(basename "$file")") >> SHA256SUMS.txt
          done < <(find . -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.blockmap" -o -name "latest.yml" \) -print0 | sort -z)

          cat SHA256SUMS.txt
          if [ "$(wc -l < SHA256SUMS.txt)" -lt 3 ]; then
            echo "ERROR: Expected at least the three Windows updater files in SHA256SUMS.txt"
            exit 1
          fi
          if [ "$(cut -c67- SHA256SUMS.txt | sort | uniq -d | wc -l)" -ne 0 ]; then
            echo "ERROR: Two published files share a name"
            exit 1
          fi

      # Signed statement, stored by GitHub, that these exact files were built by this workflow from this commit.
      # Anyone can check a download with: gh attestation verify <file> --repo <owner>/<repo>
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: releases/artifacts/SHA256SUMS.txt

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF#refs/tags/}"
          RELEASE_NOTES_FILE="releases/${TAG}.md"

          mapfile -d '' RELEASE_FILES < <(find releases/artifacts/ -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.blockmap" -o -name "latest.yml" -o -name "SHA256SUMS.txt" \) -print0 2>/dev/null)

          if [ ${#RELEASE_FILES[@]} -eq 0 ]; then
            echo "ERROR: No release assets found!"
            exit 1
          fi

          echo "Found ${#RELEASE_FILES[@]} release assets:"
          printf '  - %s\n' "${RELEASE_FILES[@]}"

          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file "$RELEASE_NOTES_FILE" \
            --draft \
            --prerelease

          gh release upload "$TAG" "${RELEASE_FILES[@]}" --clobber

          RELEASE_ASSET_NAMES="$(gh release view "$TAG" --json assets --jq '.assets[].name' | sort)"
          EXPECTED_ASSET_NAMES="$(printf '%s\n' "${RELEASE_FILES[@]##*/}" | sort)"

          if [ "$RELEASE_ASSET_NAMES" != "$EXPECTED_ASSET_NAMES" ]; then
            echo "ERROR: Uploaded release assets do not match the staged files"
            echo "Expected:"
            printf '  - %s\n' "$EXPECTED_ASSET_NAMES"
            echo "Actual:"
            printf '  - %s\n' "$RELEASE_ASSET_NAMES"
            exit 1
          fi

          gh release edit "$TAG" --draft=false --prerelease=false --latest
