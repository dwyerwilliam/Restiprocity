name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        include:
          - os: macos-latest
            platform: mac
            arch: x64
            targets: 'dmg'
          - os: windows-latest
            platform: win
            arch: x64
            targets: 'nsis'
          - os: ubuntu-latest
            platform: linux
            arch: x64
            targets: 'AppImage'
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - name: Build renderer
        run: npm run build:renderer

      - name: Build main/preload
        run: npx vite build --config vite.config.ts

      - name: Package Windows
        if: matrix.platform == 'win'
        shell: bash
        run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Package macOS
        if: matrix.platform == 'mac'
        run: npx electron-builder --mac --publish never
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Package Linux
        if: matrix.platform == 'linux'
        run: npx electron-builder --linux --publish never
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: releases/artifacts/**/*
          retention-days: 1

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Build renderer
        run: npm run build:renderer

      - name: Run E2E tests
        run: npm test

  release:
    needs: [build, test]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: releases/artifacts

      - name: Prepare release assets
        run: |
          echo "=== Win artifacts ==="
          ls -la releases/artifacts/release-win/ 2>/dev/null || echo "No win artifacts"
          echo "=== Mac artifacts ==="
          ls -la releases/artifacts/release-mac/ 2>/dev/null || echo "No mac artifacts"
          echo "=== Linux artifacts ==="
          ls -la releases/artifacts/release-linux/ 2>/dev/null || echo "No linux artifacts"

          # Remove unpacked directories and .app bundles
          find releases/artifacts/ -type d -name "*-unpacked" -exec rm -rf {} + 2>/dev/null || true
          find releases/artifacts/ -type d -name "*.app" -exec rm -rf {} + 2>/dev/null || true

          echo "=== After cleanup ==="
          find releases/artifacts/ -type f

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          RELEASE_NOTES_FILE="releases/${TAG}.md"

          if [ ! -f "$RELEASE_NOTES_FILE" ]; then
            echo "ERROR: Missing release notes file: $RELEASE_NOTES_FILE"
            exit 1
          fi

          # Collect release artifacts by extension into an array (handles spaces in filenames)
          mapfile -d '' RELEASE_FILES < <(find releases/artifacts/ -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.AppImage" \) -print0 2>/dev/null)

          if [ ${#RELEASE_FILES[@]} -eq 0 ]; then
            echo "ERROR: No release assets found!"
            exit 1
          fi

          echo "Found ${#RELEASE_FILES[@]} release assets:"
          printf '  - %s\n' "${RELEASE_FILES[@]}"

          # Build gh release command - array expansion preserves spaces in filenames
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file "$RELEASE_NOTES_FILE" \
            --latest \
            "${RELEASE_FILES[@]}"
