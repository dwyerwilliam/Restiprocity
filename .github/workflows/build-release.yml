name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        include:
          - os: macos-latest
            platform: mac
            arch: x64
            targets: 'dmg'
          - os: windows-latest
            platform: win
            arch: x64
            targets: 'nsis'
          - os: ubuntu-latest
            platform: linux
            arch: x64
            targets: 'AppImage'
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - name: Build renderer
        run: npm run build:renderer

      - name: Build main/preload
        run: npx vite build --config vite.config.ts

      - name: Package Windows
        if: matrix.platform == 'win'
        shell: bash
        run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Package macOS
        if: matrix.platform == 'mac'
        run: npx electron-builder --mac --publish never
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Package Linux
        if: matrix.platform == 'linux'
        run: npx electron-builder --linux --publish never
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: releases/artifacts/**/*
          retention-days: 1

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Build renderer
        run: npm run build:renderer

      - name: Run E2E tests
        run: npm test

  updater-unit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run updater service tests
        run: npm run test:update

  release:
    needs: [build, test, updater-unit]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: releases/artifacts

      - name: Prepare release assets
        run: |
          set -euo pipefail

          echo "=== Win artifacts ==="
          ls -la releases/artifacts/release-win/ 2>/dev/null || echo "No win artifacts"
          echo "=== Mac artifacts ==="
          ls -la releases/artifacts/release-mac/ 2>/dev/null || echo "No mac artifacts"
          echo "=== Linux artifacts ==="
          ls -la releases/artifacts/release-linux/ 2>/dev/null || echo "No linux artifacts"

          # Remove unpacked directories and .app bundles
          find releases/artifacts/ -type d -name "*-unpacked" -exec rm -rf {} + 2>/dev/null || true
          find releases/artifacts/ -type d -name "*.app" -exec rm -rf {} + 2>/dev/null || true

          echo "=== After cleanup ==="
          find releases/artifacts/ -type f

      - name: Validate release contract
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF#refs/tags/}"
          RELEASE_NOTES_FILE="releases/${TAG}.md"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_VERSION="${TAG#v}"
          WIN_DIR="releases/artifacts/release-win"
          INSTALLER="${WIN_DIR}/Restiprocity-Setup-${PACKAGE_VERSION}.exe"
          BLOCKMAP="${INSTALLER}.blockmap"
          LATEST_YML="${WIN_DIR}/latest.yml"

          if [ "$PACKAGE_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "ERROR: Tag ${TAG} does not match package.json version ${PACKAGE_VERSION}"
            exit 1
          fi

          if [ ! -f "$RELEASE_NOTES_FILE" ]; then
            echo "ERROR: Missing release notes file: $RELEASE_NOTES_FILE"
            exit 1
          fi

          for asset in "$INSTALLER" "$BLOCKMAP" "$LATEST_YML"; do
            if [ ! -f "$asset" ]; then
              echo "ERROR: Missing required Windows updater asset: $asset"
              exit 1
            fi
          done

          mapfile -t WINDOWS_ASSETS < <(find "$WIN_DIR" -maxdepth 1 -type f \( -name 'Restiprocity-Setup-*.exe' -o -name 'Restiprocity-Setup-*.exe.blockmap' -o -name 'latest.yml' \) | sort)

          if [ "${#WINDOWS_ASSETS[@]}" -ne 3 ]; then
            echo "ERROR: Windows updater asset set must contain exactly one installer, one blockmap, and one latest.yml"
            printf '  - %s\n' "${WINDOWS_ASSETS[@]}"
            exit 1
          fi

          node -e 'const fs=require("fs"); const crypto=require("crypto"); const yaml=require("js-yaml"); const metadata=yaml.load(fs.readFileSync(process.argv[1], "utf8")); if(!metadata||metadata.version!==process.argv[3]){console.error("ERROR: latest.yml version does not match package.json"); process.exit(1);} if(!Array.isArray(metadata.files)||metadata.files.length!==1){console.error("ERROR: latest.yml must contain exactly one installer entry"); process.exit(1);} const entry=metadata.files[0]; const installerName=entry.url; const expectedName="Restiprocity-Setup-"+process.argv[3]+".exe"; if(installerName!==expectedName){console.error("ERROR: latest.yml references unexpected installer name: "+installerName); process.exit(1);} if(entry.isAdminRightsRequired!==true){console.error("ERROR: latest.yml must require administrator rights for the per-machine installer"); process.exit(1);} if(typeof entry.sha512!=="string"||entry.sha512.length===0){console.error("ERROR: latest.yml installer entry is missing sha512"); process.exit(1);} if(metadata.path!==installerName||metadata.sha512!==entry.sha512){console.error("ERROR: latest.yml top-level path/sha512 must match files[0]"); process.exit(1);} const installerPath=process.argv[2]+"/"+installerName; if(!fs.existsSync(installerPath)){console.error("ERROR: latest.yml references missing installer: "+installerName); process.exit(1);} const actualSha=crypto.createHash("sha512").update(fs.readFileSync(installerPath)).digest("base64"); if(actualSha!==entry.sha512){console.error("ERROR: latest.yml sha512 does not match the installer"); process.exit(1);} console.log("Validated "+installerName+" against latest.yml with administrator rights required");' "$LATEST_YML" "$WIN_DIR" "$PACKAGE_VERSION"

          echo "Windows updater contract validated for ${PACKAGE_VERSION}"

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF#refs/tags/}"
          RELEASE_NOTES_FILE="releases/${TAG}.md"

          mapfile -d '' RELEASE_FILES < <(find releases/artifacts/ -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.blockmap" -o -name "latest.yml" \) -print0 2>/dev/null)

          if [ ${#RELEASE_FILES[@]} -eq 0 ]; then
            echo "ERROR: No release assets found!"
            exit 1
          fi

          echo "Found ${#RELEASE_FILES[@]} release assets:"
          printf '  - %s\n' "${RELEASE_FILES[@]}"

          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file "$RELEASE_NOTES_FILE" \
            --draft \
            --prerelease

          gh release upload "$TAG" "${RELEASE_FILES[@]}" --clobber

          RELEASE_ASSET_NAMES="$(gh release view "$TAG" --json assets --jq '.assets[].name' | sort)"
          EXPECTED_ASSET_NAMES="$(printf '%s\n' "${RELEASE_FILES[@]##*/}" | sort)"

          if [ "$RELEASE_ASSET_NAMES" != "$EXPECTED_ASSET_NAMES" ]; then
            echo "ERROR: Uploaded release assets do not match the staged files"
            echo "Expected:"
            printf '  - %s\n' "$EXPECTED_ASSET_NAMES"
            echo "Actual:"
            printf '  - %s\n' "$RELEASE_ASSET_NAMES"
            exit 1
          fi

          gh release edit "$TAG" --draft=false --prerelease=false --latest
