name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
        include:
          - os: macos-latest
            platform: mac
            arch: x64
            targets: 'dmg'
          - os: windows-latest
            platform: win
            arch: x64
            targets: 'nsis'
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - name: Build renderer
        run: npm run build:renderer

      - name: Build main/preload
        run: npx vite build --config vite.config.ts

      - name: Package Windows
        if: matrix.platform == 'win'
        run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Package macOS
        if: matrix.platform == 'mac'
        run: npx electron-builder --mac --publish never
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release/**/*
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          echo "=== Win artifacts ==="
          ls -la artifacts/release-win/ 2>/dev/null || echo "No win artifacts"
          echo "=== Mac artifacts ==="
          ls -la artifacts/release-mac/ 2>/dev/null || echo "No mac artifacts"

          # Remove unpacked directories and .app bundles
          find artifacts/ -type d -name "*-unpacked" -exec rm -rf {} + 2>/dev/null || true
          find artifacts/ -type d -name "*.app" -exec rm -rf {} + 2>/dev/null || true

          echo "=== After cleanup ==="
          find artifacts/ -type f

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"

          # Collect only actual release artifacts by extension (not bundle internals)
          RELEASE_FILES=$(find artifacts/ -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.yml" -o -name "*.blockmap" \) 2>/dev/null || true)

          if [ -z "$RELEASE_FILES" ]; then
            echo "ERROR: No release assets found!"
            exit 1
          fi

          # Build gh release command with actual files
          CMD="gh release create \"$TAG\" --title \"$TAG\" --notes \"See changelog for details.\" --latest"

          for f in $RELEASE_FILES; do
            CMD="$CMD \"$f\""
          done

          echo "Running: $CMD"
          eval "$CMD"
